name: Prepare Mac release candidates

on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact reviewed application commit
        required: true
        type: string
      recipient:
        description: Base64 public encryption key for private artifact review
        required: true
        type: string
      review_release:
        description: Private draft release ID holding exact artifact approvals
        required: true
        type: string
      repackage_run:
        description: Optional existing encrypted candidate run for signature-only repackaging
        required: false
        default: ''
        type: string
      architecture:
        description: Architectures requiring a new installer
        required: true
        default: all
        type: choice
        options:
          - all
          - arm64
          - x64

permissions:
  contents: write

jobs:
  candidate:
    if: github.repository == 'surfacedby/OpenGEO'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.architecture == 'x64' && '{"include":[{"os":"macos-15-intel","arch":"x64"}]}' || inputs.architecture == 'arm64' && '{"include":[{"os":"macos-15","arch":"arm64"}]}' || '{"include":[{"os":"macos-15","arch":"arm64"},{"os":"macos-15-intel","arch":"x64"}]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      REVIEW_SOURCE: ${{ inputs.source }}
      REVIEW_RECIPIENT: ${{ inputs.recipient }}
      REVIEW_RELEASE: ${{ inputs.review_release }}
      REVIEW_ARCH: ${{ matrix.arch }}
      REPACKAGE_RUN: ${{ inputs.repackage_run }}
    steps:
      - name: Validate release scope
        run: |
          python3 - <<'PY'
          import base64, os, re
          assert re.fullmatch('[0-9a-f]{40}', os.environ['REVIEW_SOURCE'])
          assert re.fullmatch('[0-9]+', os.environ['REVIEW_RELEASE'])
          key = base64.b64decode(os.environ['REVIEW_RECIPIENT'], validate=True)
          assert key.startswith(b'-----BEGIN PUBLIC KEY-----')
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.4.1'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check:public
      - name: Build exact Mac application source
        if: inputs.repackage_run == ''
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEW_SOURCE"
          node scripts/clean-build.mjs --desktop-installer --platform=mac --arch="$REVIEW_ARCH" --desktop-output=release/mac-candidate
      - name: Recover only the authorized existing package
        if: inputs.repackage_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=commonjs <<'JS'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),{execFileSync}=require('node:child_process');
          const {pipeline}=require('node:stream/promises');
          (async()=>{
            if(!/^\d+$/.test(process.env.REPACKAGE_RUN))throw new Error('Invalid original run');
            const api=(route,...args)=>execFileSync('gh',['api',route,...args],{encoding:'utf8',stdio:['ignore','pipe','pipe']});
            const review=JSON.parse(api('repos/surfacedby/OpenGEO/releases/'+process.env.REVIEW_RELEASE));
            if(!review.draft||review.target_commitish!==process.env.REVIEW_SOURCE)throw new Error('Private recovery scope changed');
            const name='repackage-'+process.env.REPACKAGE_RUN+'-'+process.env.REVIEW_ARCH+'.json';
            const asset=review.assets.find(row=>row.name===name);if(!asset)throw new Error('Missing private recovery authorization');
            const authorization=JSON.parse(api('repos/surfacedby/OpenGEO/releases/assets/'+asset.id,'-H','Accept: application/octet-stream'));
            if(authorization.scope!=='resource-seal-only'||authorization.sourceCommit!==process.env.REVIEW_SOURCE||authorization.arch!==process.env.REVIEW_ARCH||String(authorization.originalRunId)!==process.env.REPACKAGE_RUN)throw new Error('Recovery authorization differs');
            const artifact=JSON.parse(api('repos/surfacedby/OpenGEO/actions/artifacts/'+authorization.artifactId));
            if(String(artifact.workflow_run.id)!==process.env.REPACKAGE_RUN||artifact.workflow_run.head_sha!==authorization.workflowHead||artifact.digest!=='sha256:'+authorization.artifactZipSha256||artifact.name!=='mac-review-'+process.env.REVIEW_ARCH+'-'+process.env.REPACKAGE_RUN)throw new Error('Original artifact identity differs');
            const root=path.join(process.env.RUNNER_TEMP,'mac-input-'+process.env.REVIEW_ARCH);fs.mkdirSync(root);
            const archive=path.join(root,'encrypted.zip'),fd=fs.openSync(archive,'wx');
            try{execFileSync('gh',['api','repos/surfacedby/OpenGEO/actions/artifacts/'+artifact.id+'/zip'],{stdio:['ignore',fd,'pipe'],timeout:900000});}finally{fs.closeSync(fd);}
            const digest=async file=>{const h=crypto.createHash('sha256');for await(const chunk of fs.createReadStream(file))h.update(chunk);return h.digest('hex');};
            if(await digest(archive)!==authorization.artifactZipSha256)throw new Error('Original encrypted archive changed');
            const names=execFileSync('unzip',['-Z1',archive],{encoding:'utf8'}).trim().split('\n').sort();
            if(JSON.stringify(names)!==JSON.stringify(['candidate.bin','envelope.json']))throw new Error('Unexpected encrypted members');
            execFileSync('unzip',['-q',archive,'-d',root]);
            const envelope=JSON.parse(fs.readFileSync(path.join(root,'envelope.json'),'utf8'));
            if(envelope.sourceCommit!==authorization.sourceCommit||envelope.arch!==authorization.arch||String(envelope.runId)!==process.env.REPACKAGE_RUN||envelope.plainSha256!==authorization.bundleSha256)throw new Error('Original encrypted envelope changed');
            const key=Buffer.from(authorization.contentKeyBase64,'base64');if(key.length!==32)throw new Error('Invalid content key');
            const decipher=crypto.createDecipheriv('aes-256-gcm',key,Buffer.from(envelope.iv,'base64'));decipher.setAuthTag(Buffer.from(envelope.tag,'base64'));
            const temporary=path.join(root,'original.tar.partial');
            await pipeline(fs.createReadStream(path.join(root,'candidate.bin')),decipher,fs.createWriteStream(temporary,{flags:'wx'}));
            if(await digest(temporary)!==envelope.plainSha256||fs.statSync(temporary).size!==envelope.bytes)throw new Error('Original decrypted archive changed');
            const members=execFileSync('tar',['-tf',temporary],{encoding:'utf8'}).trim().split('\n').sort();
            const expected=[authorization.installer.name,'mounted-payload.tar.gz','native-inspection.json','installed-smoke.stdout','installed-smoke.stderr'].sort();
            if(JSON.stringify(members)!==JSON.stringify(expected))throw new Error('Original native archive members differ');
            execFileSync('tar',['-xf',temporary,'-C',root]);
            if(await digest(path.join(root,authorization.installer.name))!==authorization.installer.sha256)throw new Error('Original DMG changed');
            delete authorization.contentKeyBase64;fs.writeFileSync(path.join(root,'recovery-binding.json'),JSON.stringify(authorization,null,2));
            key.fill(0);
          })().catch(error=>{console.error(error);process.exitCode=1});
          JS
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import ast, hashlib, json, os, plistlib, subprocess, tarfile, textwrap
          root=Path.cwd()
          original=Path(os.environ['RUNNER_TEMP'])/('mac-input-'+os.environ['REVIEW_ARCH'])
          native=json.loads((original/'native-inspection.json').read_text())
          assert native['source']==os.environ['REVIEW_SOURCE'] and str(native['runId'])==os.environ['REPACKAGE_RUN']
          workflow=subprocess.check_output(['git','show','90d409451da3a2a4dae844335e8b8e0bfc30fbdd:.github/workflows/mac-candidates.yml']).decode()
          assert hashlib.sha256(workflow.encode()).hexdigest()=='cbb1422e302cd1c9158ad5814289220c99a71c46af27abe85e684e331f991978'
          code=workflow.split('      - name: Inspect and operate the actual mounted installer\n',1)[1].split("          python3 - <<'PY'\n",1)[1].split('\n          PY',1)[0]
          code=textwrap.dedent(code)
          for node in ast.parse(code).body:
              if isinstance(node,ast.FunctionDef) and node.name in ['digest','inventory']:
                  exec(compile(ast.Module(body=[node],type_ignores=[]),'original-native-inventory','exec'))
          attached=plistlib.loads(subprocess.check_output(['hdiutil','attach','-readonly','-nobrowse','-plist',str(original/native['installer']['name'])]))
          mounts=[Path(row['mount-point']) for row in attached['system-entities'] if 'mount-point' in row]
          assert len(mounts)==1
          mount=mounts[0]
          try:
              import stat
              assert inventory(mount,volume=True)==native['mounted_inventory']
              app=root/'release/mac-candidate'/('mac-arm64' if os.environ['REVIEW_ARCH']=='arm64' else 'mac')/'OpenGEO.app'
              app.parent.mkdir(parents=True)
              subprocess.run(['ditto',str(mount/'OpenGEO.app'),str(app)],check=True)
              assert inventory(app)==inventory(mount/'OpenGEO.app')
          finally:
              subprocess.run(['hdiutil','detach',str(mount)],check=True)
          regular=original/'regular'
          regular.mkdir()
          with tarfile.open(original/'mounted-payload.tar.gz') as package:
              seen=set()
              for member in package.getmembers():
                  name=PurePosixPath(member.name)
                  assert name.parts[0]=='mounted' and '..' not in name.parts and not name.is_absolute()
                  relative='/'.join(name.parts[1:]);assert relative in native['mounted_inventory'] and relative not in seen;seen.add(relative)
                  expected=native['mounted_inventory'][relative]
                  if expected['kind']!='file':continue
                  assert member.isfile() or member.islnk()
                  destination=regular/relative;destination.parent.mkdir(parents=True,exist_ok=True)
                  with package.extractfile(member) as source,destination.open('xb') as target:
                      while block:=source.read(1048576):target.write(block)
                  assert digest(destination)==expected['sha256']
              assert seen==set(native['mounted_inventory'])
          PY
      - name: Seal the preview without a developer account
        run: |
          node --input-type=commonjs <<'JS'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),{execFileSync}=require('node:child_process');
          (async()=>{
            const {signAsync}=require('@electron/osx-sign');
            const app=path.resolve('release/mac-candidate',process.env.REVIEW_ARCH==='arm64'?'mac-arm64':'mac','OpenGEO.app');
            const entitlements=path.join(process.env.RUNNER_TEMP,'preview-jit-'+process.env.REVIEW_ARCH+'.plist');
            fs.writeFileSync(entitlements,'<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>com.apple.security.cs.allow-jit</key><true/></dict></plist>');
            // These two functionless vendor stubs have no load-command padding. Signing them
            // overwrites their dyld fixup header; preserve exact upstream bytes as sealed resources.
            const stubHome='Contents/Resources/browsers/chromium_headless_shell-1243/chrome-headless-shell-mac-x64/';
            const preserved=process.env.REVIEW_ARCH==='x64'?new Map([
              [path.join(app,stubHome,'libEGL.dylib'),'71a00bc0c12b510e63364720f1cda4735863113017e5051ee3a952dfcc475c69'],
              [path.join(app,stubHome,'libGLESv2.dylib'),'3a26faf71edbbbac22668b20c79ec787196084023e002be987fa5420179008de']
            ]):new Map();
            const verifyStubs=()=>{for(const [file,hash]of preserved)if(crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')!==hash)throw new Error('Vendor stub bytes changed');};
            verifyStubs();
            const ignore=file=>{
              if(fs.realpathSync(file)!==file)return true;
              if(preserved.has(file))return true;
              if(fs.statSync(file).isDirectory())return !file.endsWith('.app')&&!file.endsWith('.framework');
              const fd=fs.openSync(file,'r'),magic=Buffer.alloc(4);try{fs.readSync(fd,magic,0,4,0);}finally{fs.closeSync(fd);}
              return !['cffaedfe','cefaedfe','feedfacf','feedface','cafebabe','cafebabf','bebafeca','bfbafeca'].includes(magic.toString('hex'));
            };
            await signAsync({app,identity:'-',identityValidation:false,platform:'darwin',version:require('./node_modules/electron/package.json').version,
              // The locked signer normalizes a scalar callback; its array path drops the option.
              strictVerify:true,preAutoEntitlements:false,preEmbedProvisioningProfile:false,ignore,
              optionsForFile:()=>({hardenedRuntime:false,entitlements,timestamp:'none'})});
            verifyStubs();
            execFileSync('codesign',['--verify','--deep','--strict',app]);
            const copy=path.resolve('release/mac-sealed',process.env.REVIEW_ARCH==='arm64'?'mac-arm64':'mac','OpenGEO.app');
            fs.mkdirSync(path.dirname(copy),{recursive:true});execFileSync('ditto',[app,copy]);
            const systemNames=new Set(['PATH','PATHEXT','SYSTEMROOT','WINDIR','COMSPEC','TEMP','TMP','USERPROFILE','HOME','APPDATA','LOCALAPPDATA','PROGRAMDATA','PROGRAMFILES','PROGRAMFILES(X86)','SYSTEMDRIVE','NUMBER_OF_PROCESSORS','PSMODULEPATH']);
            const environment=Object.fromEntries(Object.entries(process.env).filter(([name])=>systemNames.has(name.toUpperCase())));
            environment.CSC_IDENTITY_AUTO_DISCOVERY='false';
            execFileSync(process.execPath,['node_modules/electron-builder/out/cli/cli.js','--mac','dmg','--'+process.env.REVIEW_ARCH,'--prepackaged',copy,
              '--config.directories.output=release/mac-sealed','--config.mac.notarize=false','--publish','never'],{stdio:'inherit',timeout:600000,env:environment});
          })().catch(error=>{console.error(error);process.exitCode=1});
          JS
      - name: Inspect and operate the actual mounted installer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, plistlib, shutil, stat, subprocess, tarfile, tempfile

          root = Path.cwd()
          out = Path(os.environ['RUNNER_TEMP']) / ('mac-review-' + os.environ['REVIEW_ARCH'])
          out.mkdir()
          candidates = list((root / 'release/mac-sealed').glob('*.dmg'))
          assert len(candidates) == 1
          dmg = candidates[0]
          arch = os.environ['REVIEW_ARCH']
          version = json.loads((root / 'package.json').read_text())['version']
          asset_name = 'OpenGEO-' + version + '-macos-' + arch + '.dmg'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip() == os.environ['REVIEW_SOURCE']
          assert not subprocess.check_output(['git', 'status', '--porcelain=v1']).strip()

          def digest(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()

          def inventory(base, volume=False):
              result = {}
              for current, directories, files in os.walk(base, followlinks=False):
                  for name in directories + files:
                      path = Path(current) / name
                      relative = path.relative_to(base).as_posix()
                      mode = path.lstat().st_mode
                      assert not mode & (stat.S_ISUID | stat.S_ISGID)
                      row = {'mode': stat.S_IMODE(mode)}
                      if path.is_symlink():
                          target = os.readlink(path)
                          resolved = path.resolve()
                          assert resolved.is_relative_to(base.resolve()) or (volume and relative == 'Applications' and target == '/Applications')
                          row.update(kind='symlink', target=target)
                      elif path.is_dir():
                          row.update(kind='directory')
                      else:
                          assert stat.S_ISREG(mode)
                          row.update(kind='file', bytes=path.stat().st_size, sha256=digest(path))
                      result[relative] = row
              return result

          attached = plistlib.loads(subprocess.check_output(['hdiutil', 'attach', '-readonly', '-nobrowse', '-plist', str(dmg)]))
          mounts = [Path(row['mount-point']) for row in attached['system-entities'] if 'mount-point' in row]
          assert len(mounts) == 1
          mount = mounts[0]
          install = out / 'installation'
          install.mkdir()
          app = install / 'OpenGEO.app'
          try:
              before = inventory(mount, volume=True)
              assert (mount / 'OpenGEO.app').is_dir()
              built = root / 'release/mac-sealed' / ('mac-arm64' if arch == 'arm64' else 'mac') / 'OpenGEO.app'
              assert inventory(built) == inventory(mount / 'OpenGEO.app')
              subprocess.run(['ditto', str(mount / 'OpenGEO.app'), str(app)], check=True)
              assert inventory(app) == inventory(mount / 'OpenGEO.app')
              with (out / 'installed-smoke.stdout').open('wb') as stdout, (out / 'installed-smoke.stderr').open('wb') as stderr:
                  smoke = subprocess.run(['node', 'scripts/desktop-smoke.mjs', str(app / 'Contents/MacOS/OpenGEO')], stdout=stdout, stderr=stderr, timeout=150)
              assert smoke.returncode == 0
              assert before == inventory(mount, volume=True)
              info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
              signatures = {}
              for name, command in {
                  'display': ['codesign', '-dv', '--verbose=4', str(app)],
                  'verify': ['codesign', '--verify', '--deep', '--strict', str(app)],
                  'gatekeeper': ['spctl', '--assess', '--type', 'execute', '--verbose=4', str(app)],
              }.items():
                  result = subprocess.run(command, capture_output=True, timeout=30)
                  signatures[name] = {'exit': result.returncode, 'stdout': result.stdout.decode(errors='replace'), 'stderr': result.stderr.decode(errors='replace')}
              assert signatures['verify']['exit'] == 0
              assert 'Signature=adhoc' in signatures['display']['stderr']
              source_files = {name: digest(root / name) for name in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0') if name}
              record = {'source': os.environ['REVIEW_SOURCE'], 'runId': os.environ['GITHUB_RUN_ID'], 'arch': arch,
                        'installer': {'name': asset_name, 'bytes': dmg.stat().st_size, 'sha256': digest(dmg)},
                        'mounted_inventory': before, 'source_files': source_files, 'actual_dmg_payload_equals_build': True,
                        'actual_installed_payload_equals_dmg': True, 'installed_smoke_exit': smoke.returncode,
                        'minimum_macos': info.get('LSMinimumSystemVersion'), 'version': info.get('CFBundleShortVersionString'),
                        'signatures': signatures, 'developer_id_signed': False, 'notarized': False, 'ad_hoc_resource_seal_verified': True,
                        'test_scope': 'GitHub hosted matching Mac runner; actual readonly DMG mounted and copied to an owned installation directory',
                        'clean_machine_or_gatekeeper_override_acceptance': False}
              (out / 'native-inspection.json').write_text(json.dumps(record, indent=2))
              snapshot_name = 'mounted-payload.tar.gz'
              if os.environ['REPACKAGE_RUN']:
                  import io
                  original = Path(os.environ['RUNNER_TEMP']) / ('mac-input-' + arch)
                  parent = json.loads((original / 'native-inspection.json').read_text())
                  assert parent['source'] == record['source'] and parent['source_files'] == record['source_files']
                  patches = {}
                  counter = 0
                  snapshot_name = 'mounted-delta.tar.gz'
                  with tarfile.open(out / snapshot_name, 'w:gz') as archive:
                      for name, current in before.items():
                          if current['kind'] != 'file': continue
                          previous = parent['mounted_inventory'].get(name)
                          if previous and previous['kind'] == 'file' and previous['sha256'] == current['sha256']: continue
                          old = original / 'regular' / name
                          baseline = old.open('rb') if old.is_file() else io.BytesIO()
                          changes = []
                          with baseline, (mount / name).open('rb') as fresh:
                              offset = 0
                              while block := fresh.read(4096):
                                  previous_block = baseline.read(len(block))
                                  if block != previous_block:
                                      chunk = 'chunks/' + str(counter) + '.bin'; counter += 1
                                      member = tarfile.TarInfo(chunk); member.size = len(block); archive.addfile(member, io.BytesIO(block))
                                      changes.append({'offset': offset, 'bytes': len(block), 'member': chunk})
                                  offset += len(block)
                          patches[name] = {'base_sha256': previous['sha256'] if previous and previous['kind'] == 'file' else None,
                                           'sha256': current['sha256'], 'bytes': current['bytes'], 'changes': changes}
                      delta = {'parent_run': os.environ['REPACKAGE_RUN'], 'parent_installer': parent['installer'], 'arch': arch,
                               'parent_inventory': parent['mounted_inventory'], 'patches': patches,
                               'removed': sorted(set(parent['mounted_inventory']) - set(before))}
                      encoded = json.dumps(delta, indent=2).encode(); member = tarfile.TarInfo('delta.json'); member.size = len(encoded); archive.addfile(member, io.BytesIO(encoded))
                  record['snapshot_kind'] = 'authenticated-parent-plus-fixed-offset-block-delta'
                  record['repackage_parent'] = {'run': os.environ['REPACKAGE_RUN'], 'installer': parent['installer']}
              else:
                  with tarfile.open(out / snapshot_name, 'w:gz', dereference=False) as archive:
                      for path in mount.iterdir():
                          archive.add(path, arcname='mounted/' + path.name)
                  record['snapshot_kind'] = 'complete-mounted-filesystem'
              shutil.copyfile(dmg, out / asset_name)
          finally:
              subprocess.run(['hdiutil', 'detach', str(mount)], check=True)
              assert app.parent == out / 'installation'
              shutil.rmtree(app)
          assert not app.exists()
          record['owned_program_removed_after_test'] = True
          (out / 'native-inspection.json').write_text(json.dumps(record, indent=2))
          with tarfile.open(out / 'review-bundle.tar', 'w') as archive:
              for name in [asset_name, snapshot_name, 'native-inspection.json', 'installed-smoke.stdout', 'installed-smoke.stderr']:
                  archive.add(out / name, arcname=name)
          print(json.dumps({'arch': arch, 'dmg': dmg.name, 'sha256': record['installer']['sha256'], 'installedSmoke': smoke.returncode, 'minimumMacOS': record['minimum_macos']}))
          PY
      - name: Encrypt the candidate and native review evidence
        run: |
          node --input-type=commonjs <<'JS'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const {pipeline}=require('node:stream/promises');
          (async()=>{
            const root=path.join(process.env.RUNNER_TEMP,'mac-review-'+process.env.REVIEW_ARCH);
            const file=path.join(root,'review-bundle.tar'),output=path.join(root,'encrypted');fs.mkdirSync(output);
            const key=crypto.randomBytes(32),iv=crypto.randomBytes(12),cipher=crypto.createCipheriv('aes-256-gcm',key,iv),hash=crypto.createHash('sha256');
            const input=fs.createReadStream(file);input.on('data',chunk=>hash.update(chunk));
            await pipeline(input,cipher,fs.createWriteStream(path.join(output,'candidate.bin'),{flags:'wx'}));
            const wrapped=crypto.publicEncrypt({key:Buffer.from(process.env.REVIEW_RECIPIENT,'base64'),oaepHash:'sha256',padding:crypto.constants.RSA_PKCS1_OAEP_PADDING},key);
            const record={sourceCommit:process.env.REVIEW_SOURCE,runId:process.env.GITHUB_RUN_ID,arch:process.env.REVIEW_ARCH,name:'review-bundle.tar',bytes:fs.statSync(file).size,
              plainSha256:hash.digest('hex'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),wrappedKey:wrapped.toString('base64')};
            fs.writeFileSync(path.join(output,'envelope.json'),JSON.stringify(record,null,2));
          })().catch(error=>{console.error(error);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac-review-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mac-review-${{ matrix.arch }}/encrypted/*
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Wait for exact Mac artifact review approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=commonjs <<'JS'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),{execFileSync}=require('node:child_process');
          (async()=>{
            const root=path.join(process.env.RUNNER_TEMP,'mac-review-'+process.env.REVIEW_ARCH),candidate=JSON.parse(fs.readFileSync(path.join(root,'native-inspection.json'),'utf8'));
            const name='approval-'+process.env.GITHUB_RUN_ID+'-'+process.env.REVIEW_ARCH+'.json';
            const api=(route,...args)=>execFileSync('gh',['api',route,...args],{encoding:'utf8',stdio:['ignore','pipe','pipe']});
            let approved=false;
            for(let attempt=0;attempt<180;attempt++){
              const review=JSON.parse(api('repos/surfacedby/OpenGEO/releases/'+process.env.REVIEW_RELEASE));
              if(!review.draft||review.target_commitish!==candidate.source)throw new Error('Private approval scope changed');
              const asset=review.assets.find(row=>row.name===name);
              if(asset){
                const approval=JSON.parse(api('repos/surfacedby/OpenGEO/releases/assets/'+asset.id,'-H','Accept: application/octet-stream'));
                if(approval.sourceCommit!==candidate.source||approval.sha256!==candidate.installer.sha256||approval.bytes!==candidate.installer.bytes||approval.arch!==candidate.arch||String(approval.runId)!==process.env.GITHUB_RUN_ID||approval.approvedForUnsignedBeta!==true)throw new Error('Approval does not bind this exact installer');
                approved=true;break;
              }
              if(attempt%3===0)console.log('Waiting for exact '+candidate.arch+' artifact review');
              await new Promise(resolve=>setTimeout(resolve,20000));
            }
            if(!approved)throw new Error('Exact-artifact review approval deadline expired');
            const file=path.join(root,candidate.installer.name),hash=crypto.createHash('sha256');
            for await(const chunk of fs.createReadStream(file))hash.update(chunk);
            if(hash.digest('hex')!==candidate.installer.sha256)throw new Error('Installer changed after review');
            const release=JSON.parse(api('repos/surfacedby/OpenGEO/releases/tags/v0.1.0-beta.1'));
            if(release.draft||!release.prerelease||release.target_commitish!==candidate.source||release.assets.some(row=>row.name===candidate.installer.name))throw new Error('Public beta source or asset scope changed');
            execFileSync('gh',['release','upload','v0.1.0-beta.1',file,'--repo','surfacedby/OpenGEO'],{stdio:'inherit',timeout:600000});
            const uploaded=JSON.parse(api('repos/surfacedby/OpenGEO/releases/tags/v0.1.0-beta.1')).assets.find(row=>row.name===candidate.installer.name);
            if(!uploaded||uploaded.size!==candidate.installer.bytes||uploaded.digest!=='sha256:'+candidate.installer.sha256)throw new Error('Public installer differs from reviewed bytes');
            console.log('Exact reviewed Mac installer uploaded');
          })().catch(error=>{console.error(error);process.exitCode=1});
