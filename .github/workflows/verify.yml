name: Verify application

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keychain:
    if: github.repository == 'surfacedby/OpenGEO' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Compile the isolated Mac Keychain test controller
        run: clang -fobjc-arc -framework Foundation -framework Security scripts/mac-keychain-fixture.m -o "$RUNNER_TEMP/opengeo-keychain-fixture"
      - name: Prove both scoped Keychain clients and deny an unlisted program
        run: python3 tests/mac_keychain_fixture_test.py

  application:
    needs: keychain
    if: github.repository == 'surfacedby/OpenGEO' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15-intel, macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.4.1'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check:public
      - run: npm test
      - run: python tests/release_files_test.py
      - name: Prove actual Electron encryption across a copied bundle upgrade
        if: runner.os == 'macOS'
        run: python3 tests/mac_electron_keychain_test.py
      - run: node scripts/clean-build.mjs
      - run: npm run audit:deps
